<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>แอดมิน · BSRacing</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,600;1,600;1,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>

/* Layout: pit-wall console — dark brand ground, one orange accent, stations as rows, time as a track */
:root{
  --ground:#14161D; --panel:#1E212B; --raise:#262A36; --line:#323848;
  --fg:#EDEDEF; --muted:#9AA4B8; --slate:#BCC5D6;
  --accent:#EF5527; --accent-ink:#FFFFFF; --accent-soft:rgba(239,85,39,.14);
  --ok:#3DBE8B; --ok-soft:rgba(61,190,139,.14);
  --wait:#F2B33D; --wait-soft:rgba(242,179,61,.14);
  --bad:#E5646B;
  --walk:#6F7FA3;
  --f-display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;max-width:980px;margin:0 auto;flex-wrap:wrap}
.top img{height:44px;width:auto;display:block}
.mode{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.demo{max-width:980px;margin:0 auto 14px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}

.wrap{max-width:560px;margin:0 auto}
.wrap.wide{max-width:980px}
h1,h2{font-family:var(--f-display);font-weight:600;letter-spacing:.2px;text-wrap:balance;margin:0}
h1{font-size:26px;font-style:italic;font-weight:700}
h2{font-size:17px}
.step{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.step b{font-family:var(--f-display);font-style:italic;color:var(--accent);font-size:15px}
.hint{color:var(--muted);font-size:13px}

.tabs{display:flex;gap:6px;margin:6px 0 4px}
.tabs button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--slate)}
.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px}

/* stations */
.zone{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.stations{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.st .n{font-family:var(--f-display);font-weight:600;font-size:16px}
.st .s{font-size:12.5px;color:var(--muted);line-height:1.4}
.st .p{font-size:13px;margin-top:6px;color:var(--slate)}
.st[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),transparent 70%),var(--panel)}
.st[aria-pressed="true"] .n{color:var(--accent)}
.st .tag{align-self:flex-start;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-top:6px}

/* dates */
.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dates button{flex:0 0 auto;width:58px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:0}
.dates .w{font-size:12px;color:var(--muted)}
.dates .d{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.2}
.dates .m{font-size:11px;color:var(--muted)}
.dates button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.dates button[aria-pressed="true"] .w,.dates button[aria-pressed="true"] .m{color:var(--accent-ink)}

/* slots */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 0;font-family:var(--f-mono);font-size:14px}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.period{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:6px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:14px}

.durs{display:flex;flex-wrap:wrap;gap:6px}
.durs button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.durs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.durs button:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}

.fields{display:grid;gap:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--fg);font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.note{font-size:13px;color:var(--slate);background:var(--raise);border-radius:10px;padding:10px 12px;margin-top:10px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(20,22,29,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.35}
.bar .sum strong{display:block;color:var(--fg);font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:16px;letter-spacing:.3px}
.btn:disabled{background:var(--raise);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.ok{background:var(--ok);color:#0E1A14}
.btn.sm{padding:8px 14px;font-size:14px}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pending{background:var(--wait-soft);color:var(--wait)}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.rejected,.pill.expired,.pill.cancelled{background:rgba(229,100,107,.12);color:var(--bad)}
.pill.online{background:var(--accent-soft);color:var(--accent)}
.pill.walkin{background:rgba(111,127,163,.18);color:var(--slate)}

/* booking cards */
.list{display:grid;gap:8px}
.bk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px}
.bk .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bk .where{font-family:var(--f-display);font-weight:600;font-size:16px}
.bk .when{font-size:14px}
.bk .meta{font-size:13px;color:var(--muted)}
.bk .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.bk.pending{border-left:3px solid var(--wait)}
.timer{font-size:12.5px;color:var(--wait)}

/* success sheet */
.done{text-align:center;padding:30px 4px 10px}
.done .badge{width:62px;height:62px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--wait-soft);color:var(--wait);font-size:28px}

/* LINE preview */
.chat{background:#8CABD9;border-radius:14px;padding:14px;margin-top:16px;display:grid;gap:8px;text-align:left}
.chat .lbl{font-size:11.5px;color:#22324F;text-align:center}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.45;color:#111;white-space:pre-line}
.bub.me{justify-self:end;background:#A6E46B;border-top-right-radius:4px}
.bub.oa{justify-self:start;background:#fff;border-top-left-radius:4px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:20;width:min(420px,calc(100% - 32px));
  background:#fff;color:#111;border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.toast .ic{flex:0 0 32px;height:32px;border-radius:8px;background:#06C755;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.toast .tt{font-weight:600;font-size:12.5px;color:#555}
.toast p{margin:0;white-space:pre-line}

/* admin */
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:20px;color:var(--fg);margin-right:6px}
.kpi.hot b{color:var(--wait)}
.admin-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.admin-grid{grid-template-columns:minmax(0,1fr)}}

.tl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.tl-in{min-width:calc(96px + 13 * 60px);position:relative}
.tl-row{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--line);min-height:44px}
.tl-row:first-child{border-top:0}
.tl-name{position:sticky;left:0;z-index:2;background:var(--panel);font-size:12.5px;font-weight:600;padding:12px 10px;border-right:1px solid var(--line);white-space:nowrap}
.tl-track{position:relative;background-image:repeating-linear-gradient(90deg,transparent 0 59px,var(--line) 59px 60px)}
.tl-hours .tl-track{background:none}
.tl-hours span{position:absolute;top:12px;font-size:11px;color:var(--muted);padding-left:5px}
.blk{position:absolute;top:6px;bottom:6px;border-radius:7px;padding:3px 7px;font-size:11.5px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;text-align:left}
.blk.approved{background:var(--accent);color:var(--accent-ink)}
.blk.walkin{background:var(--walk);color:#fff}
.blk.pending{background:repeating-linear-gradient(135deg,var(--wait-soft) 0 6px,rgba(242,179,61,.28) 6px 12px);color:var(--wait);outline:1px dashed var(--wait);outline-offset:-1px}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.7;z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

.walkform{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;margin-top:12px}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}.row3 .field:first-child{grid-column:1/-1}}
.bk.editing{border-color:var(--accent);gap:10px}
button.blk{cursor:pointer}
.seg{display:flex;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--slate)}
.by{font-size:12.5px;color:var(--slate)}
.by b{font-weight:600;color:var(--fg)}
.adminbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.me{display:flex;align-items:center;gap:8px;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line);font-weight:600;font-size:13px;flex:0 0 auto}
.role{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--raise);color:var(--slate)}
.role.owner{background:var(--accent-soft);color:var(--accent)}
.adminbar .seg{flex:1 1 220px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.gate{max-width:400px;margin:28px auto 0;text-align:center;display:grid;gap:14px}
.gate .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:12px}
.btn.line{background:#06C755;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.line span{font-size:11px;font-weight:700;background:#fff;color:#06C755;border-radius:5px;padding:1px 5px}
.accts{display:grid;gap:6px;text-align:left}
.accts button{display:flex;align-items:center;gap:10px;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.accts small{margin-left:auto;color:var(--muted);font-size:12px}
.urow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;flex-wrap:wrap}
.urow .who2{flex:1 1 170px;min-width:0;display:grid}
.urow .who2 small{color:var(--muted);font-size:12.5px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log div{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.log div:first-child{border-top:0}
.log time{color:var(--muted)}
button.blk:hover{filter:brightness(1.12)}
.bk.live .acts{margin-top:4px}
.err{color:var(--bad);font-size:13px}

@media (prefers-reduced-motion:no-preference){.toast{animation:drop .3s ease-out}@keyframes drop{from{opacity:0;transform:translate(-50%,-10px)}}}
@media (max-width:380px){.slots{grid-template-columns:repeat(3,1fr)}}

html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{padding-block:0 60px}
.loading{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);padding:28px 0;font-size:14px}
.loading::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.flash{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:20;width:min(420px,calc(100% - 32px));background:var(--raise);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.flash.err{border-color:var(--bad)}
.flash.ok{border-color:var(--ok)}
.seg{display:flex;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--slate)}
.by{font-size:12.5px;color:var(--slate)}
.by b{font-weight:600;color:var(--fg)}
.adminbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.me{display:flex;align-items:center;gap:8px;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line);font-weight:600;font-size:13px;flex:0 0 auto}
.role{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--raise);color:var(--slate)}
.role.owner{background:var(--accent-soft);color:var(--accent)}
.adminbar .seg{flex:1 1 220px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.gate{max-width:400px;margin:28px auto 0;text-align:center;display:grid;gap:14px}
.gate .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:12px}
.urow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;flex-wrap:wrap}
.urow .who2{flex:1 1 170px;min-width:0;display:grid}
.urow .who2 small{color:var(--muted);font-size:12.5px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.log div:first-child{border-top:0}
.log time{color:var(--muted)}
.bk.editing{border-color:var(--accent);gap:10px}
button.blk{cursor:pointer}
button.blk:hover{filter:brightness(1.12)}
.pill.online{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>

<main id="app" class="wrap wide"><div class="loading">กำลังเปิดหน้าแอดมิน</div></main>
<div id="flashHost"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  VERSION: "v1.1",
  API_URL: "https://script.google.com/macros/s/AKfycbwfxIc46TQ7griKcfTst3lVoTT1OKLYRUlbRwcoqnHLmPiKxPmhjkN9aWUSgkMFp-AVgQ/exec",
  LIFF_ID: "2012074679-ktyOGuKv",
  OPEN: 11 * 60,
  CLOSE: 24 * 60,
  PENDING_EXPIRE_MIN: 30,
  REFRESH_SEC: 30
};
const STATIONS = [
  {id:"SIM1", name:"SIM 1"}, {id:"SIM2", name:"SIM 2"}, {id:"SIM3", name:"SIM 3"},
  {id:"F1", name:"SIM F1"}, {id:"GT", name:"SIM GT"}, {id:"MOTION", name:"SIM MOTION"},
  {id:"CONP", name:"CON PREMIUM"}, {id:"CONN", name:"CON NORMAL"}
];
const ADM_DURS = [30, 60, 90, 120, 150, 180, 240, 300, 360];

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const hm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const WD = ["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
const MO = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const ymdParts = s => s.split("-").map(Number);
const addDays = (s, n) => { const [y,m,d] = ymdParts(s); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0, 10); };
const dayInfo = s => { const [y,m,d] = ymdParts(s); const t = new Date(Date.UTC(y, m-1, d)); return {wd: t.getUTCDay(), d, m: m-1}; };
const thDate = s => { const i = dayInfo(s); return `${WD[i.wd]} ${i.d} ${MO[i.m]}`; };
const durTxt = m => m < 60 ? `${m} นาที` : (m % 60 ? `${Math.floor(m/60)} ชม. ${m%60} นาที` : `${m/60} ชม.`);
const st = id => STATIONS.find(s => s.id === id) || { id, name: id };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const ago = ms => { const m = Math.floor((Date.now() - ms) / 60000); return m < 1 ? "เมื่อสักครู่" : m < 60 ? `${m} นาทีที่แล้ว` : `${Math.floor(m/60)} ชม.ที่แล้ว`; };
const clock = ms => { if (!ms) return ""; const d = new Date(Number(ms)); const k = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  return (k === TODAY ? "" : `${d.getDate()} ${MO[d.getMonth()]} `) + hm(d.getHours()*60 + d.getMinutes()); };
const initials = n => esc([...String(n || "?").trim()][0] || "?");

let ID_TOKEN = "", TODAY = "";
const A = { me:null, view:"queue", date:"", pending:null, day:null, users:null, loading:false,
  confirmReject:null, confirmCancel:null, confirmRemove:null, edit:null, ed:null, working:false,
  walk:{ type:"walkin", station:"SIM1", start:CONFIG.OPEN, dur:60, name:"", phone:"" }, err:"", errAt:"" };

/* ===================== API ===================== */
async function api(action, payload = {}) {
  let j;
  try {
    const r = await fetch(CONFIG.API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ action, idToken: ID_TOKEN, ...payload }) });
    j = await r.json();
  } catch (e) { throw new Error("เชื่อมต่อระบบไม่ได้ ลองใหม่อีกครั้ง"); }
  if (!j.ok) {
    if (j.code === "AUTH") { try { liff.logout(); } catch (_) {} liff.login({ redirectUri: location.href }); }
    const e = new Error(j.error || "ทำรายการไม่สำเร็จ"); e.code = j.code; throw e;
  }
  return j.data;
}
function flash(text, kind) {
  $("#flashHost").innerHTML = `<div class="flash ${kind || ""}" role="status">${esc(text)}</div>`;
  clearTimeout(flash.t); flash.t = setTimeout(() => $("#flashHost").innerHTML = "", 4500);
}
function fatal(text) { $("#app").innerHTML = `<div class="empty" style="margin-top:20px">${esc(text)}</div>`; }

/* ===================== boot ===================== */
async function boot() {
  try { await liff.init({ liffId: CONFIG.LIFF_ID }); }
  catch (e) { return fatal("เปิดหน้าแอดมินไม่สำเร็จ ลองเปิดจากลิงก์ในกลุ่มแอดมินอีกครั้ง"); }
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  ID_TOKEN = liff.getIDToken();
  try {
    const cfg = await api("config");
    TODAY = cfg.today; A.date = TODAY;
    A.me = await api("admin.me");
  } catch (e) { return fatal(e.message); }
  if (A.me.role) await loadQueue();
  render();
  setInterval(autoRefresh, CONFIG.REFRESH_SEC * 1000);
}

async function loadQueue() {
  const [pending, day] = await Promise.all([api("admin.pending"), api("admin.day", { date: A.date })]);
  A.pending = pending; A.day = day;
}
async function loadUsers() { A.users = await api("admin.users"); }

async function autoRefresh() {
  if (!A.me || !A.me.role || A.view !== "queue" || A.edit || A.working || document.visibilityState !== "visible") return;
  const el = document.activeElement;
  if (el && /INPUT|SELECT|TEXTAREA/.test(el.tagName)) return;
  try { await loadQueue(); render(); } catch (_) {}
}

// ทำงาน 1 คำสั่ง แล้วโหลดข้อมูลใหม่
async function run(fn, okText, errAt) {
  if (A.working) return;
  A.working = true; A.err = ""; render();
  try {
    await fn();
    if (A.me && A.me.role) { if (A.view === "users") await loadUsers(); else await loadQueue(); }
    if (okText) flash(okText, "ok");
  } catch (e) {
    A.err = e.message; A.errAt = errAt || ""; flash(e.message, "err");
    try { if (A.me && A.me.role && A.view === "queue") await loadQueue(); } catch (_) {}
  }
  A.working = false; render();
}

/* ===================== render ===================== */
function render() {
  const root = $("#app");
  if (!A.me) return;
  if (!A.me.role) { root.innerHTML = noAccessHtml(); return; }
  let html = adminBar();
  if (A.view === "users") {
    if (!A.users) { loadUsers().then(render).catch(e => flash(e.message, "err")); html += `<div class="loading">กำลังโหลดผู้ใช้</div>`; }
    else html += `<div class="wrap" style="margin:0">${usersHtml()}</div>`;
    root.innerHTML = html; return;
  }
  if (!A.pending || !A.day) { root.innerHTML = html + `<div class="loading">กำลังโหลดคิว</div>`; return; }
  const pend = A.pending;
  const live = A.day.filter(b => b.status === "approved").sort((a, b) => a.start - b.start || a.station.localeCompare(b.station));
  html += `
    <div class="kpis">
      <div class="kpi ${pend.length ? "hot" : ""}"><b class="num">${pend.length}</b>รออนุมัติ</div>
      <div class="kpi"><b class="num">${live.length}</b>คิว${A.date === TODAY ? "วันนี้" : " " + thDate(A.date)}</div>
      <button class="btn ghost sm" data-refresh="1" style="margin-left:auto" ${A.working ? "disabled" : ""}>${A.working ? "กำลังทำรายการ…" : "รีเฟรช"}</button>
    </div>
    <div class="admin-grid">
      <section>
        <div class="step"><h2>คำขอรออนุมัติ</h2></div>
        ${pend.length ? `<div class="list">${pend.map(cardPending).join("")}</div>` : `<div class="empty">ไม่มีคำขอค้าง</div>`}
        <div class="step"><h2>เพิ่มคิว</h2></div>
        ${addForm()}
      </section>
      <section style="min-width:0">
        <div class="step"><h2>ตารางเครื่อง</h2></div>
        <div class="dates" style="margin-bottom:10px">${dateChips()}</div>
        ${timeline(A.day)}
        <div class="legend">
          <span><i style="background:var(--accent)"></i>ออนไลน์</span>
          <span><i style="background:var(--walk)"></i>walk-in</span>
          <span><i style="background:var(--wait-soft);outline:1px dashed var(--wait)"></i>รออนุมัติ (กันช่องไว้แล้ว)</span>
        </div>
        <div class="step"><h2>คิว${A.date === TODAY ? "วันนี้" : " " + thDate(A.date)}</h2><span class="hint">แตะบล็อกในตารางเพื่อแก้ไขได้</span></div>
        ${live.length ? `<div class="list">${live.map(cardLive).join("")}</div>` : `<div class="empty">ยังไม่มีคิวในวันนี้</div>`}
      </section>
    </div>
    <p class="hint" style="text-align:center;margin-top:24px">BSRacing Booking ${CONFIG.VERSION}</p>`;
  root.innerHTML = html;
}

function adminBar() {
  const u = A.me, owner = u.role === "owner";
  return `<div class="adminbar">
    <div class="me"><span class="av">${initials(u.name)}</span>${esc(u.name)}<span class="role ${u.role}">${owner ? "เจ้าของ" : "แอดมิน"}</span></div>
    ${owner ? `<div class="seg" role="tablist">
      <button data-view="queue" aria-pressed="${A.view !== "users"}">คิวและการจอง</button>
      <button data-view="users" aria-pressed="${A.view === "users"}">จัดการผู้ใช้${A.users && A.users.requests.length ? ` (${A.users.requests.length})` : ""}</button>
    </div>` : ""}
    ${liff.isInClient() ? "" : `<button class="linkbtn" data-logout="1">ออกจากระบบ</button>`}
  </div>`;
}

function noAccessHtml() {
  const u = A.me;
  return `<div class="gate"><div class="card">
    <div class="av" style="width:52px;height:52px;margin:0 auto;font-size:20px">${initials(u.name)}</div>
    <h1>ยังไม่มีสิทธิ์ใช้งาน</h1>
    <p class="hint" style="margin:0">บัญชี LINE <b>${esc(u.name)}</b> ยังไม่ได้รับสิทธิ์แอดมิน</p>
    ${u.requested ? `<div class="note" style="margin:0">ส่งคำขอแล้ว รอเจ้าของร้านอนุมัติ</div>`
                  : `<button class="btn" data-reqaccess="1" ${A.working ? "disabled" : ""}>ขอสิทธิ์แอดมิน</button>`}
    ${liff.isInClient() ? "" : `<button class="linkbtn" data-logout="1">ออกจากระบบ</button>`}
  </div></div>`;
}

function timeOptions(sel) {
  let o = "";
  for (let t = CONFIG.OPEN; t < CONFIG.CLOSE; t += 30) o += `<option value="${t}" ${Number(sel) === t ? "selected" : ""}>${hm(t)}</option>`;
  return o;
}
function stationOptions(sel) { return STATIONS.map(s => `<option value="${s.id}" ${sel === s.id ? "selected" : ""}>${s.name}</option>`).join(""); }
function durOptions(sel) { return ADM_DURS.map(d => `<option value="${d}" ${Number(sel) === d ? "selected" : ""}>${durTxt(d)}</option>`).join(""); }

function addForm() {
  const w = A.walk, online = w.type === "online";
  return `<div class="walkform">
    <div class="seg" role="group" aria-label="ประเภทการจอง">
      <button data-wtype="walkin" aria-pressed="${!online}">Walk-in</button>
      <button data-wtype="online" aria-pressed="${online}">จองออนไลน์</button>
    </div>
    <div class="row3">
      <div class="field"><label for="w-st">เครื่อง</label><select id="w-st">${stationOptions(w.station)}</select></div>
      <div class="field"><label for="w-start">เริ่ม</label><select id="w-start">${timeOptions(w.start)}</select></div>
      <div class="field"><label for="w-dur">นาน</label><select id="w-dur">${durOptions(w.dur)}</select></div>
    </div>
    ${online
      ? `<div class="row2"><div class="field"><label for="w-name">ชื่อลูกค้า</label><input id="w-name" value="${esc(w.name)}" maxlength="40"></div>
           <div class="field"><label for="w-phone">เบอร์โทร</label><input id="w-phone" inputmode="tel" value="${esc(w.phone)}" placeholder="08x-xxx-xxxx" maxlength="12"></div></div>
         <p class="hint" style="margin:0">ใช้กับลูกค้าที่จองทางแชทหรือโทรศัพท์ คิวจะขึ้นสถานะอนุมัติแล้วโดย ${esc(A.me.name)}</p>`
      : `<div class="field"><label for="w-name">ชื่อลูกค้า (ไม่บังคับ)</label><input id="w-name" value="${esc(w.name)}" placeholder="walk-in" maxlength="40"></div>`}
    ${A.err && A.errAt === "walk" ? `<p class="err" style="margin:0">${esc(A.err)}</p>` : ""}
    <button class="btn sm" id="w-add" ${A.working ? "disabled" : ""}>เพิ่มลงตาราง ${thDate(A.date)}</button>
    <p class="hint" style="margin:0">ลงในปฏิทินร้านเป็น <span class="num">[${esc(st(w.station).name)}] ชื่อ เบอร์</span> ช่องนี้จะหายจากหน้าจองของลูกค้าทันที</p>
  </div>`;
}

function dateChips() {
  let h = "";
  for (let i = -1; i < 7; i++) {
    const k = addDays(TODAY, i), inf = dayInfo(k);
    h += `<button data-adate="${k}" aria-pressed="${A.date === k}"><span class="w">${i === 0 ? "วันนี้" : WD[inf.wd]}</span><span class="d num">${inf.d}</span><span class="m">${MO[inf.m]}</span></button>`;
  }
  return h;
}

function cardPending(b) {
  const s = st(b.station);
  const left = Math.max(0, CONFIG.PENDING_EXPIRE_MIN - Math.floor((Date.now() - b.createdAt) / 60000));
  const confirming = A.confirmReject === b.id;
  return `<div class="bk pending">
    <div class="head"><span class="where">${esc(s.name)}</span><span class="timer num">หมดอายุใน ${left} นาที</span></div>
    <div class="when num">${thDate(b.date)} · ${hm(b.start)}–${hm(b.end)} <span class="hint">(${durTxt(b.end - b.start)})</span></div>
    <div class="meta">${esc(b.name)} · <span class="num">${esc(b.phone)}</span>${b.people > 1 ? ` · ${b.people} คน` : ""} · ส่งมา ${ago(b.createdAt)}</div>
    <div class="acts">
      ${confirming
        ? `<button class="btn sm" style="background:var(--bad)" data-reject="${b.id}" ${A.working ? "disabled" : ""}>ยืนยันไม่อนุมัติ</button><button class="btn ghost sm" data-cancelreject="1">ยกเลิก</button>`
        : `<button class="btn ok sm" data-approve="${b.id}" ${A.working ? "disabled" : ""}>อนุมัติ</button><button class="btn ghost sm" data-askreject="${b.id}">ไม่อนุมัติ</button>`}
    </div>
  </div>`;
}

function byLine(b) {
  const parts = [];
  if (b.manual) parts.push("ลงในปฏิทินโดยตรง");
  else if (b.type === "walkin") parts.push(`ลงโดย <b>${esc(b.addedBy || "-")}</b> · ${clock(b.createdAt)}`);
  else if (!b.hasLine) parts.push(`แอดมินลงแทนลูกค้า · อนุมัติโดย <b>${esc(b.approvedBy || b.addedBy || "-")}</b> · ${clock(b.approvedAt || b.createdAt)}`);
  else parts.push(`จองผ่าน LINE · อนุมัติโดย <b>${esc(b.approvedBy || "-")}</b> · ${clock(b.approvedAt)}`);
  if (b.editedBy) parts.push(`แก้ไขล่าสุดโดย <b>${esc(b.editedBy)}</b> · ${clock(b.editedAt)}`);
  return `<div class="by num">${parts.join("<br>")}</div>`;
}

function cardLive(b) {
  const s = st(b.station), walk = b.type === "walkin";
  if (A.edit === b.id) {
    const e = A.ed;
    return `<div class="bk editing" id="bk-${esc(b.id)}">
      <div class="head"><span class="where">แก้ไขคิว · ${esc(b.name)}</span></div>
      ${b.manual ? "" : `<div class="seg" role="group" aria-label="ประเภทการจอง">
        <button data-etype="walkin" aria-pressed="${e.type === "walkin"}">Walk-in</button>
        <button data-etype="online" aria-pressed="${e.type === "online"}">จองออนไลน์</button>
      </div>`}
      <div class="row3">
        <div class="field"><label for="e-st">เครื่อง</label><select id="e-st">${stationOptions(e.station)}</select></div>
        <div class="field"><label for="e-start">เริ่ม</label><select id="e-start">${timeOptions(e.start)}</select></div>
        <div class="field"><label for="e-dur">นาน</label><select id="e-dur">${durOptions(e.dur)}</select></div>
      </div>
      ${A.err && A.errAt === "edit" ? `<p class="err" style="margin:0">${esc(A.err)}</p>` : ""}
      <div class="acts" style="margin-top:0"><button class="btn ok sm" data-save="${esc(b.id)}" ${A.working ? "disabled" : ""}>บันทึก</button><button class="btn ghost sm" data-closeedit="1">ปิด</button></div>
      ${b.hasLine ? `<p class="hint" style="margin:0">ลูกค้าจะได้รับข้อความ LINE แจ้งเวลาใหม่ และปฏิทินร้านจะอัปเดตตาม</p>` : ""}
    </div>`;
  }
  const confirming = A.confirmCancel === b.id;
  return `<div class="bk live" id="bk-${esc(b.id)}">
    <div class="head"><span class="where">${esc(s.name)}</span><span class="pill ${walk ? "walkin" : "online"}">${walk ? "Walk-in" : "ออนไลน์"}</span></div>
    <div class="when num">${hm(b.start)}–${hm(b.end)} <span class="hint">(${durTxt(b.end - b.start)})</span></div>
    <div class="meta">${esc(b.name)}${b.phone ? ` · <span class="num">${esc(b.phone)}</span>` : ""}${b.people > 1 ? ` · ${b.people} คน` : ""}</div>
    ${byLine(b)}
    <div class="acts">
      ${confirming
        ? `<button class="btn sm" style="background:var(--bad)" data-cancelbk="${esc(b.id)}" ${A.working ? "disabled" : ""}>ยืนยันยกเลิกคิว</button><button class="btn ghost sm" data-keep="1">ไม่ยกเลิก</button>`
        : `<button class="btn ghost sm" data-edit="${esc(b.id)}">แก้ไข</button><button class="btn ghost sm" style="color:var(--bad)" data-askcancel="${esc(b.id)}">ยกเลิกคิว</button>`}
    </div>
    ${confirming && b.hasLine ? `<p class="hint" style="margin:0">ช่องเวลานี้จะกลับมาว่างในหน้าจอง และลูกค้าจะได้รับแจ้งทาง LINE</p>` : ""}
  </div>`;
}

function timeline(day) {
  const W = 60, open = CONFIG.OPEN, hours = (CONFIG.CLOSE - open) / 60;
  const x = m => (m - open) / 60 * W;
  let h = `<div class="tl"><div class="tl-in">
    <div class="tl-row tl-hours"><div class="tl-name"></div><div class="tl-track">${Array.from({length: hours + 1}, (_, i) => `<span class="num" style="left:${i * W}px">${pad(open / 60 + i)}</span>`).join("")}</div></div>`;
  const showNow = A.date === TODAY && nowMin() >= open && nowMin() <= CONFIG.CLOSE;
  STATIONS.forEach(s => {
    const items = day.filter(b => b.station === s.id && (b.status === "approved" || b.status === "pending"));
    h += `<div class="tl-row"><div class="tl-name">${esc(s.name)}</div><div class="tl-track">
      ${showNow ? `<div class="now" style="left:${x(nowMin())}px"></div>` : ""}
      ${items.map(b => {
        const cls = b.status === "pending" ? "pending" : (b.type === "walkin" ? "walkin" : "approved");
        const tag = b.status === "pending" ? "div" : "button";
        const st0 = Math.max(open, b.start), en0 = Math.min(CONFIG.CLOSE, b.end);
        return `<${tag} class="blk ${cls}" ${tag === "button" ? `data-edit="${esc(b.id)}"` : ""} style="left:${x(st0) + 2}px;width:${Math.max(6, x(en0) - x(st0) - 4)}px" title="${esc(s.name)} ${hm(b.start)}–${hm(b.end)} ${esc(b.name)}">${hm(b.start)} ${esc(b.name)}</${tag}>`;
      }).join("")}
    </div></div>`;
  });
  return h + `</div></div>`;
}

function usersHtml() {
  const U = A.users;
  return `
    <div class="step"><h2>คำขอสิทธิ์</h2></div>
    ${U.requests.length ? `<div class="list">${U.requests.map(r => `<div class="urow">
      <span class="av">${initials(r.name)}</span><div class="who2"><span>${esc(r.name)}</span><small>ขอสิทธิ์เมื่อ ${clock(r.at)}</small></div>
      <button class="btn ok sm" data-grant="${esc(r.lineId)}" ${A.working ? "disabled" : ""}>ให้สิทธิ์แอดมิน</button><button class="btn ghost sm" data-deny="${esc(r.lineId)}" ${A.working ? "disabled" : ""}>ปฏิเสธ</button>
    </div>`).join("")}</div>` : `<div class="empty">ไม่มีคำขอใหม่ · พนักงานใหม่เปิดหน้าแอดมินจากกลุ่มไลน์ แล้วกด "ขอสิทธิ์แอดมิน"</div>`}
    <div class="step"><h2>ผู้ใช้ที่มีสิทธิ์</h2><span class="hint">${U.admins.length} คน</span></div>
    <div class="list">${U.admins.map(u => {
      const confirming = A.confirmRemove === u.lineId;
      return `<div class="urow">
        <span class="av">${initials(u.name)}</span>
        <div class="who2"><span>${esc(u.name)} <span class="role ${u.role}">${u.role === "owner" ? "เจ้าของ" : "แอดมิน"}</span></span><small>${u.role === "owner" ? "ผู้ดูแลสิทธิ์ทั้งหมด" : `ได้สิทธิ์ ${clock(u.since)} โดย ${esc(u.by)}`}</small></div>
        ${u.role === "owner" ? "" : confirming
          ? `<button class="btn sm" style="background:var(--bad)" data-remove="${esc(u.lineId)}" ${A.working ? "disabled" : ""}>ยืนยันลบสิทธิ์</button><button class="btn ghost sm" data-keepuser="1">ไม่ลบ</button>`
          : `<button class="btn ghost sm" style="color:var(--bad)" data-askremove="${esc(u.lineId)}">ลบสิทธิ์</button>`}
      </div>`; }).join("")}</div>
    <p class="hint">ลบสิทธิ์แล้ว อย่าลืมเอาคนนั้นออกจากกลุ่มไลน์แอดมินด้วย</p>
    <div class="step"><h2>ประวัติการใช้งาน</h2><span class="hint">ล่าสุดก่อน</span></div>
    ${U.audit.length ? `<div class="log">${U.audit.map(l => `<div><time class="num">${clock(l.at)}</time><span><b>${esc(l.by)}</b> ${esc(l.text)}</span></div>`).join("")}</div>` : `<div class="empty">ยังไม่มีรายการ</div>`}`;
}

/* ===================== events ===================== */
$("#app").addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.logout) { try { liff.logout(); } catch (_) {} location.reload(); return; }
  if (d.reqaccess) return run(async () => { A.me = await api("admin.request"); }, "ส่งคำขอแล้ว");
  if (d.view) { A.view = d.view; A.confirmRemove = null; A.err = ""; if (A.view === "users") A.users = null; return render(); }
  if (d.refresh) return run(async () => {});
  if (d.approve) return run(() => api("admin.approve", { id: d.approve }), "อนุมัติแล้ว ลงปฏิทินและแจ้งลูกค้าเรียบร้อย");
  if (d.askreject) { A.confirmReject = d.askreject; return render(); }
  if (d.cancelreject) { A.confirmReject = null; return render(); }
  if (d.reject) { A.confirmReject = null; return run(() => api("admin.reject", { id: d.reject }), "ไม่อนุมัติแล้ว แจ้งลูกค้าเรียบร้อย"); }
  if (d.adate) { A.date = d.adate; A.edit = null; A.confirmCancel = null; A.day = null; render(); return run(async () => {}); }
  if (d.wtype) { A.walk.type = d.wtype; return render(); }
  if (d.etype) { A.ed.type = d.etype; return render(); }
  if (d.edit) {
    const b = A.day.find(x => x.id === d.edit);
    if (b) { A.edit = b.id; A.ed = { type: b.type || "walkin", station: b.station, start: b.start, dur: b.end - b.start }; A.confirmCancel = null; A.err = ""; }
    render(); document.getElementById("bk-" + d.edit)?.scrollIntoView({ block: "center", behavior: "smooth" }); return;
  }
  if (d.closeedit) { A.edit = null; A.err = ""; return render(); }
  if (d.save) {
    const id = d.save, ed = A.ed;
    return run(async () => { await api("admin.update", { id, type: ed.type, station: ed.station, start: ed.start, dur: ed.dur }); A.edit = null; }, "บันทึกแล้ว", "edit");
  }
  if (d.askcancel) { A.confirmCancel = d.askcancel; A.edit = null; return render(); }
  if (d.keep) { A.confirmCancel = null; return render(); }
  if (d.cancelbk) { const id = d.cancelbk; A.confirmCancel = null; return run(() => api("admin.cancel", { id }), "ยกเลิกคิวแล้ว"); }
  if (t.id === "w-add") {
    const w = A.walk;
    return run(async () => {
      await api("admin.add", { type: w.type, station: w.station, date: A.date, start: w.start, dur: w.dur, name: w.name.trim(), phone: w.phone.trim() });
      w.name = ""; w.phone = "";
    }, "เพิ่มคิวแล้ว", "walk");
  }
  if (d.grant) return run(() => api("admin.grant", { lineId: d.grant }), "ให้สิทธิ์แล้ว");
  if (d.deny) return run(() => api("admin.deny", { lineId: d.deny }), "ปฏิเสธคำขอแล้ว");
  if (d.askremove) { A.confirmRemove = d.askremove; return render(); }
  if (d.keepuser) { A.confirmRemove = null; return render(); }
  if (d.remove) { const id = d.remove; A.confirmRemove = null; return run(() => api("admin.remove", { lineId: id }), "ลบสิทธิ์แล้ว"); }
});
$("#app").addEventListener("change", e => {
  const id = e.target.id, v = e.target.value;
  if (id === "w-st") { A.walk.station = v; render(); }
  if (id === "w-start") A.walk.start = +v;
  if (id === "w-dur") A.walk.dur = +v;
  if (id === "e-st") A.ed.station = v;
  if (id === "e-start") A.ed.start = +v;
  if (id === "e-dur") A.ed.dur = +v;
});
$("#app").addEventListener("input", e => {
  if (e.target.id === "w-name") A.walk.name = e.target.value;
  if (e.target.id === "w-phone") A.walk.phone = e.target.value;
});

boot();
</script>
</body>
</html>
